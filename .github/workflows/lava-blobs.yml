name: Build Lava Blobs APK

on:
  push:
    branches:
      - main
    paths:
      - 'app/**'
      - 'build.gradle'
      - 'settings.gradle'
      - '.github/workflows/lava-blobs.yml'
  pull_request:
    paths:
      - 'app/**'
      - 'build.gradle'
      - 'settings.gradle'
      - '.github/workflows/lava-blobs.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Android SDK 35
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0"
      - name: Test game physics
        run: gradle --no-daemon :app:testDebugUnitTest
      - name: Build APKs
        run: gradle --no-daemon :app:assembleDebug :app:assemblePreview
      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: lava-blobs-android-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
      - name: Upload side-by-side preview APK
        uses: actions/upload-artifact@v4
        with:
          name: lava-blob-preview-android
          path: app/build/outputs/apk/preview/app-preview.apk
          if-no-files-found: error
