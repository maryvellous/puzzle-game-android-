name: Build Lava Blobs APK

on:
  push:
    branches:
      - main
    paths:
      - 'app/**'
      - 'tools/audio_v2_java/**'
      - 'build.gradle'
      - 'settings.gradle'
      - '.github/workflows/lava-blobs.yml'
  pull_request:
    paths:
      - 'app/**'
      - 'tools/audio_v2_java/**'
      - 'build.gradle'
      - 'settings.gradle'
      - '.github/workflows/lava-blobs.yml'
  workflow_dispatch:

concurrency:
  group: lava-blobs-ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Android SDK 35
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0"
      - name: Validate bundled soft impact WAV
        run: |
          python3 - <<'PY'
          import math, struct, wave
          path="app/src/main/res/raw/lava_impact_soft.wav"
          with wave.open(path,"rb") as audio:
              assert audio.getnchannels()==1
              assert audio.getsampwidth()==2
              assert audio.getframerate()==24000
              assert 0.08 <= audio.getnframes()/audio.getframerate() <= 0.12
              data=audio.readframes(audio.getnframes())
          pcm=struct.unpack("<"+"h"*(len(data)//2),data)
          peak=max(abs(x) for x in pcm)
          rms=math.sqrt(sum(x*x for x in pcm)/len(pcm))
          assert 4000 < peak < 26000, peak
          assert 1000 < rms < 10000, rms
          print(f"Valid 112ms mono PCM WAV; peak={peak}, RMS={rms:.0f}")
          PY
      - name: Test solver, audio transport, lifecycle and aggregation
        run: gradle --no-daemon --no-build-cache :app:testDebugUnitTest :app:testPreviewUnitTest :app:testAggregationPreviewUnitTest
      - name: Compare dense late-game solver and event traces with reference
        run: |
          set -euo pipefail
          reference=f14cf960a780cdadb803e67b43f61c86e709a91d
          previous=6ada1c2fa7b87b8c3c21220ebb34e6de5dc9b43b
          git fetch --no-tags --depth=1 origin "$reference" "$previous"
          root=build/dense-scene
          pkg=app/src/main/java/com/maryvellous/lavablobs
          mkdir -p "$root/reference" "$root/previous" "$root/reference-classes" "$root/previous-classes" "$root/candidate-classes" "$root/results/reference" "$root/results/previous" "$root/results/candidate"
          git archive "$reference" "$pkg" | tar -x -C "$root/reference"
          git archive "$previous" "$pkg" | tar -x -C "$root/previous"
          for version in reference previous candidate; do
            source="$pkg"
            if [[ "$version" != candidate ]]; then source="$root/$version/$pkg"; fi
            javac -encoding UTF-8 -d "$root/$version-classes" \
              "$source"/{Blob,BlobWorld,Vessel,GameSpec,ContactProbe,ContactTracker,PhysicsAudioEvents,AudioPolicy}.java \
              "$source"/audio/*.java tools/audio_v2_java/DenseSceneCli.java
            java -cp "$root/$version-classes" com.maryvellous.lavablobs.DenseSceneCli "$root/results/$version" \
              | tee "$root/results/$version/timing.txt"
          done
          for shape in 0 1 2; do
            diff "$root/results/reference/dense-$shape-hashes.txt" "$root/results/candidate/dense-$shape-hashes.txt"
            for window in {0..5}; do
              cmp "$root/results/reference/dense-$shape-$window-events.csv" "$root/results/candidate/dense-$shape-$window-events.csv"
            done
          done
          echo 'Dense fixture state hashes and event traces match across all three vessel shapes.' >> "$GITHUB_STEP_SUMMARY"
          cat "$root/results/"{reference,previous,candidate}/timing.txt >> "$GITHUB_STEP_SUMMARY"
      - name: Upload dense scene regression and timing data
        uses: actions/upload-artifact@v4
        with:
          name: lava-dense-scene-${{ github.sha }}
          path: build/dense-scene/results/
          retention-days: 14
          if-no-files-found: error
      - name: Upload V2 contact-control trace (offline diagnostics only)
        uses: actions/upload-artifact@v4
        with:
          name: lava-blobs-audio-v2-contact-trace
          path: app/build/audio_v2/contact_probe_trace.csv
          retention-days: 14
          if-no-files-found: error
      - name: Render runtime-equivalent A/B replay from real solver trace
        run: |
          set -euo pipefail
          if ! test -s app/build/audio_v2/runtime_events_v1.csv; then
            echo '::error::Runtime trace missing after Gradle tests'
            find . -name '*trace*.csv' -o -name 'TEST-*AudioRuntimeTraceTest*.xml'
            exit 1
          fi
          mkdir -p build/runtime-replay/classes build/runtime-replay/decoded build/runtime-replay/results
          if ! command -v ffmpeg; then
            sudo apt-get update
            sudo apt-get install -y ffmpeg
          fi
          ffmpeg -version | head -n 1 || true
          shopt -s nullglob
          for name in bloop_1 bloop_2 bloop_3 bloop_4 swoosh_source; do
            sources=(app/src/main/res/raw/"$name".*)
            if [[ "${#sources[@]}" -ne 1 ]]; then
              echo "::error::Expected exactly one resource for $name; found ${#sources[@]}"
              exit 1
            fi
            echo "Decoding ${sources[0]}"
            ffmpeg -nostdin -v error -y -i "${sources[0]}" -ac 1 -ar 44100 -c:a pcm_s16le "build/runtime-replay/decoded/$name.wav"
          done
          echo 'Compiling shared replay core'
          javac -encoding UTF-8 -d build/runtime-replay/classes \
            app/src/main/java/com/maryvellous/lavablobs/audio/*.java \
            tools/audio_v2_java/RuntimeReplayCli.java
          echo 'Rendering shared runtime trace'
          java -cp build/runtime-replay/classes com.maryvellous.lavablobs.audio.RuntimeReplayCli \
            build/runtime-replay/decoded app/build/audio_v2/runtime_events_v1.csv build/runtime-replay/results
          cp app/build/audio_v2/runtime_events_v1.csv build/runtime-replay/results/
          echo 'Runtime replay (desktop decode, shared event adapter/scheduler/DSP):' >> "$GITHUB_STEP_SUMMARY"
          cat build/runtime-replay/results/metrics.csv >> "$GITHUB_STEP_SUMMARY"
      - name: Upload versioned runtime replay metrics and listening comparison
        uses: actions/upload-artifact@v4
        with:
          name: lava-runtime-replay-${{ github.sha }}
          path: build/runtime-replay/results/
          retention-days: 14
          if-no-files-found: error
      - name: Build APKs
        run: gradle --no-daemon :app:assembleDebug :app:assemblePreview :app:assembleAggregationPreview
      - name: Upload installable APK
        id: main_apk
        uses: actions/upload-artifact@v4
        with:
          name: lava-blobs-android-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
      - name: Upload side-by-side preview APK
        uses: actions/upload-artifact@v4
        with:
          name: lava-blob-preview-android
          path: app/build/outputs/apk/preview/app-preview.apk
          if-no-files-found: error

      - name: Verify isolated aggregation APK package
        run: |
          apk=$(find app/build/outputs/apk/aggregationPreview -name '*.apk' -print -quit)
          test -n "$apk"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$apk" | grep -F "package: name='com.maryvellous.lavablobs.audioaggregation'"
      - name: Upload independent aggregation comparison APK
        id: cluster_apk
        uses: actions/upload-artifact@v4
        with:
          name: lava-aggregation-preview-${{ github.sha }}
          path: app/build/outputs/apk/aggregationPreview/*.apk
          if-no-files-found: error

      - name: Main APK download link
        run: |
          echo '[Download Lava Blob 1.1.0 main APK (ZIP)](${{ steps.main_apk.outputs.artifact-url }})' >> "$GITHUB_STEP_SUMMARY"
          echo '[Download aggregation candidate APK (ZIP)](${{ steps.cluster_apk.outputs.artifact-url }})' >> "$GITHUB_STEP_SUMMARY"
          echo 'Commit: ${{ github.sha }}' >> "$GITHUB_STEP_SUMMARY"
