name: Build Android release

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Install Android SDK packages
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0"

      - name: Build installable APK
        run: |
          gradle --no-daemon :app:assembleDebug

      - name: Prepare release asset
        run: |
          mkdir -p release
          cp app/build/outputs/apk/debug/app-debug.apk release/rovina-puzzle-v0.3.0.apk

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: rovina-puzzle-v0.3.0
          path: release/rovina-puzzle-v0.3.0.apk

      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: v0.3.0
          APK: release/rovina-puzzle-v0.3.0.apk
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$APK" --clobber
          else
            gh release create "$TAG" "$APK" --target "$GITHUB_SHA" --title "Rovina Puzzle v0.3.0" --notes "Puzzle a scambio 10x10 con salvataggio automatico e ripresa dei puzzle non finiti. Nuova schermata di completamento sobria con immagine intera, conteggio mosse e accesso al puzzle successivo."
          fi
