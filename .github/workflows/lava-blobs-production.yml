name: Publish Lava Blob Android

on:
  push:
    branches:
      - main
    paths:
      - 'lava-blobs/**'
      - '.github/workflows/lava-blobs-production.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  production-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Android SDK 35
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0"

      - name: Verify gameplay and palette tests
        run: gradle --no-daemon -p lava-blobs :app:testDebugUnitTest

      - name: Build main-package installable APK
        run: gradle --no-daemon -p lava-blobs :app:assembleDebug

      - name: Stage distribution APK
        run: |
          mkdir -p release
          cp lava-blobs/app/build/outputs/apk/debug/app-debug.apk release/lava-blob-v1.0.5.apk

      - name: Upload versioned APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: lava-blob-v1.0.5-android
          path: release/lava-blob-v1.0.5.apk
          if-no-files-found: error

      - name: Publish dedicated Lava Blob GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: lava-blob-v1.0.5
          APK: release/lava-blob-v1.0.5.apk
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Tag $TAG already released; not replacing a published APK or its signing certificate."
            exit 0
          fi
          gh release create "$TAG" "$APK" --target "$GITHUB_SHA" \
            --title "Lava Blob v1.0.5" \
            --notes "Versione principale Android (com.maryvellous.lavablobs): tre temi Canva, HUD aggiornato, superfici avorio #E6DFE3, recipiente neutro semitrasparente e particelle originali, scoring e blob maggiorati. APK di build debug firmato dal runner CI: una versione installata con un certificato differente non può essere aggiornata direttamente; preservare i dati prima di un'eventuale disinstallazione. Non è una release firmata per Google Play."
