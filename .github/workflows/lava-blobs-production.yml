name: Publish Lava Blob Android

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  production-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Android SDK 35
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0"

      - name: Verify gameplay and palette tests
        run: gradle --no-daemon :app:testDebugUnitTest

      - name: Configure optional persistent signing key
        env:
          LAVA_KEYSTORE_BASE64: ${{ secrets.LAVA_KEYSTORE_BASE64 }}
          LAVA_SIGNING_STORE_PASSWORD: ${{ secrets.LAVA_SIGNING_STORE_PASSWORD }}
          LAVA_SIGNING_KEY_PASSWORD: ${{ secrets.LAVA_SIGNING_KEY_PASSWORD }}
          LAVA_SIGNING_KEY_ALIAS: ${{ secrets.LAVA_SIGNING_KEY_ALIAS }}
        run: |
          if [[ -n "$LAVA_KEYSTORE_BASE64" && -n "$LAVA_SIGNING_STORE_PASSWORD" && -n "$LAVA_SIGNING_KEY_ALIAS" && -n "$LAVA_SIGNING_KEY_PASSWORD" ]]; then
            printf '%s' "$LAVA_KEYSTORE_BASE64" | base64 --decode > "$GITHUB_WORKSPACE/signing.keystore"
            echo "LAVA_SIGNING_STORE_FILE=$GITHUB_WORKSPACE/signing.keystore" >> "$GITHUB_ENV"
            echo "LAVA_STABLE_SIGNING=1" >> "$GITHUB_ENV"
          else
            echo "LAVA_STABLE_SIGNING=0" >> "$GITHUB_ENV"
            echo "::warning::Persistent APK signing is not configured: this APK will have an ephemeral debug signature."
          fi

      - name: Build main-package installable APK
        env:
          LAVA_SIGNING_STORE_PASSWORD: ${{ secrets.LAVA_SIGNING_STORE_PASSWORD }}
          LAVA_SIGNING_KEY_PASSWORD: ${{ secrets.LAVA_SIGNING_KEY_PASSWORD }}
          LAVA_SIGNING_KEY_ALIAS: ${{ secrets.LAVA_SIGNING_KEY_ALIAS }}
        run: |
          if [[ "$LAVA_STABLE_SIGNING" == "1" ]]; then
            gradle --no-daemon :app:assembleRelease
          else
            gradle --no-daemon :app:assembleDebug
          fi

      - name: Stage distribution APK
        run: |
          mkdir -p release
          if [[ "$LAVA_STABLE_SIGNING" == "1" ]]; then
            cp app/build/outputs/apk/release/app-release.apk release/lava-blob-v1.0.11.apk
          else
            cp app/build/outputs/apk/debug/app-debug.apk release/lava-blob-v1.0.11.apk
          fi

      - name: Upload versioned APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: lava-blob-v1.0.11-android
          path: release/lava-blob-v1.0.11.apk
          if-no-files-found: error

      - name: Publish dedicated Lava Blob GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: lava-blob-v1.0.11
          APK: release/lava-blob-v1.0.11.apk
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Tag $TAG already released; not replacing a published APK or its signing certificate."
            exit 0
          fi
          gh release create "$TAG" "$APK" --target "$GITHUB_SHA" \
            --title "Lava Blob v1.0.11" \
            --notes "Lava Blob 1.0.11: aggiunto tasto SUONI/MUTO nella schermata di gioco. Disattiva o riattiva immediatamente tutti gli effetti sonori (fusioni, urti, lancio, POP), interrompe i suoni in corso e salva la scelta tra partite e riavvii. La musica rimane un canale distinto, da introdurre in seguito con un controllo separato. Fisica, timbro e frequenza degli urti della 1.0.10 invariati. Firma stabile configurata: $LAVA_STABLE_SIGNING (0=debug temporanea; puo richiedere disinstallazione della versione precedente, 1=stabile). Non e una release Google Play."
