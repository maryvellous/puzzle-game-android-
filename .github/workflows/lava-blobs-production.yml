name: Prepare signed Lava Blob Android

on:
  workflow_dispatch:
    inputs:
      publish_release:
        description: 'Create a GitHub Release (false = private handoff via workflow artifact)'
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  production-apk:
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Android SDK 35
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0"
      - name: Verify unit tests
        run: gradle --no-daemon :app:testDebugUnitTest
      - name: Configure persistent signing key
        env:
          LAVA_KEYSTORE_BASE64: ${{ secrets.LAVA_KEYSTORE_BASE64 }}
          LAVA_SIGNING_STORE_PASSWORD: ${{ secrets.LAVA_SIGNING_STORE_PASSWORD }}
          LAVA_SIGNING_KEY_PASSWORD: ${{ secrets.LAVA_SIGNING_KEY_PASSWORD }}
          LAVA_SIGNING_KEY_ALIAS: ${{ secrets.LAVA_SIGNING_KEY_ALIAS }}
        run: |
          set -euo pipefail
          if [[ -z "$LAVA_KEYSTORE_BASE64" || -z "$LAVA_SIGNING_STORE_PASSWORD" || -z "$LAVA_SIGNING_KEY_ALIAS" || -z "$LAVA_SIGNING_KEY_PASSWORD" ]]; then
            echo "::error::Persistent signing is required. No debug-signed distribution fallback."
            exit 1
          fi
          umask 077
          printf '%s' "$LAVA_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/lava-signing.keystore"
          echo "LAVA_SIGNING_STORE_FILE=$RUNNER_TEMP/lava-signing.keystore" >> "$GITHUB_ENV"
      - name: Build signed release
        env:
          LAVA_SIGNING_STORE_PASSWORD: ${{ secrets.LAVA_SIGNING_STORE_PASSWORD }}
          LAVA_SIGNING_KEY_PASSWORD: ${{ secrets.LAVA_SIGNING_KEY_PASSWORD }}
          LAVA_SIGNING_KEY_ALIAS: ${{ secrets.LAVA_SIGNING_KEY_ALIAS }}
        run: gradle --no-daemon :app:assembleRelease
      - name: Verify and stage APK
        id: apk
        run: |
          set -euo pipefail
          apk=app/build/outputs/apk/release/app-release.apk
          tools="$ANDROID_HOME/build-tools/35.0.0"
          "$tools/apksigner" verify --print-certs "$apk"
          badging=$("$tools/aapt" dump badging "$apk")
          package=$(printf '%s\n' "$badging" | sed -n "s/^package: name='\([^']*\)'.*/\1/p")
          version=$(printf '%s\n' "$badging" | sed -n "s/^package: .*versionName='\([^']*\)'.*/\1/p")
          code=$(printf '%s\n' "$badging" | sed -n "s/^package: .*versionCode='\([^']*\)'.*/\1/p")
          test "$package" = com.maryvellous.lavablobs
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-][A-Za-z0-9.-]+)?$ && "$code" =~ ^[0-9]+$ ]]
          if printf '%s\n' "$badging" | grep -q '^application-debuggable'; then
            echo "::error::Distribution APK must not be debuggable"
            exit 1
          fi
          mkdir -p release
          filename="lava-blob-v$version-$code.apk"
          cp "$apk" "release/$filename"
          (cd release && sha256sum "$filename" > SHA256SUMS.txt)
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "code=$code" >> "$GITHUB_OUTPUT"
          echo "filename=$filename" >> "$GITHUB_OUTPUT"
      - name: Upload signed handoff artifact
        uses: actions/upload-artifact@v4
        with:
          name: lava-blob-v${{ steps.apk.outputs.version }}-${{ steps.apk.outputs.code }}-android
          path: release/
          if-no-files-found: error
          retention-days: 30
      - name: Remove temporary signing material
        if: always()
        run: rm -f "$RUNNER_TEMP/lava-signing.keystore"

  publish-release:
    if: inputs.publish_release && github.ref == 'refs/heads/main'
    needs: production-apk
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: lava-blob-v*-android
          path: release
          merge-multiple: true
      - name: Publish explicitly requested GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          apks=(release/*.apk)
          test "${#apks[@]}" -eq 1
          (cd release && sha256sum -c SHA256SUMS.txt)
          filename=$(basename "${apks[0]}")
          tag="${filename%.apk}"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "::error::Release already exists; refusing to replace an APK."
            exit 1
          fi
          gh release create "$tag" "${apks[0]}" release/SHA256SUMS.txt --target "$GITHUB_SHA" \
            --title "$tag" --notes "Lava Blob Android: signed release. See repository documentation for features and compatibility."
