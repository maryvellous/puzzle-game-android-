plugins {
    id 'com.android.application'
}

android {
    namespace 'com.maryvellous.lavablobs'
    compileSdk 35

    defaultConfig {
        applicationId 'com.maryvellous.lavablobs'
        minSdk 26
        targetSdk 35
        versionCode 8
        versionName '1.0.2'
        manifestPlaceholders = [appLabel: 'Lava Blob']
    }

    buildTypes {
        preview {
            initWith debug
            applicationIdSuffix '.preview'
            versionNameSuffix '-prova'
            manifestPlaceholders = [appLabel: 'Lava Blob - Prova']
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.json:json:20240303'
}
