plugins {
    id 'com.android.application'
}

android {
    namespace 'com.maryvellous.lavablobs'
    compileSdk 35

    defaultConfig {
        applicationId 'com.maryvellous.lavablobs'
        minSdk 26
        targetSdk 35
        versionCode 17
        versionName '1.0.11'
        manifestPlaceholders = [appLabel: 'Lava Blob']
    }

    // Optional stable release key supplied through GitHub Actions secrets.
    // Never commit private keystores or passwords to the repository.
    signingConfigs {
        if (System.getenv('LAVA_SIGNING_STORE_FILE') &&
                System.getenv('LAVA_SIGNING_STORE_PASSWORD') &&
                System.getenv('LAVA_SIGNING_KEY_ALIAS') &&
                System.getenv('LAVA_SIGNING_KEY_PASSWORD')) {
            stable {
                storeFile file(System.getenv('LAVA_SIGNING_STORE_FILE'))
                storePassword System.getenv('LAVA_SIGNING_STORE_PASSWORD')
                keyAlias System.getenv('LAVA_SIGNING_KEY_ALIAS')
                keyPassword System.getenv('LAVA_SIGNING_KEY_PASSWORD')
            }
        }
    }

    // Generate a separate, installable Audio Test application without
    // replacing a user's regular Lava Blob package or its save data.
    buildFeatures {
        buildConfig true
    }

    buildTypes {
        debug {
            buildConfigField 'boolean', 'AUDIO_TEST', 'false'
            buildConfigField 'boolean', 'AUDIO_SIZE_TEST', 'false'
        }
        release {
            buildConfigField 'boolean', 'AUDIO_TEST', 'false'
            buildConfigField 'boolean', 'AUDIO_SIZE_TEST', 'false'
            if (signingConfigs.findByName('stable') != null)
                signingConfig signingConfigs.stable
        }
        preview {
            initWith debug
            applicationIdSuffix '.preview'
            versionNameSuffix '-prova'
            manifestPlaceholders = [appLabel: 'Lava Blob - Prova']
        }
        audioTest {
            initWith debug
            applicationIdSuffix '.audiotest'
            versionNameSuffix '-audio-test'
            buildConfigField 'boolean', 'AUDIO_TEST', 'true'
            buildConfigField 'boolean', 'AUDIO_SIZE_TEST', 'false'
            manifestPlaceholders = [appLabel: 'Lava Blob - Audio Test']
            matchingFallbacks = ['debug']
        }
        audioSizeTest {
            initWith debug
            // Distinct ID: this new APK installs next to BOTH the normal game
            // and the old Audio Test without overwriting test save data.
            applicationIdSuffix '.audiosizetest'
            versionNameSuffix '-audio-size-test'
            buildConfigField 'boolean', 'AUDIO_TEST', 'true'
            buildConfigField 'boolean', 'AUDIO_SIZE_TEST', 'true'
            manifestPlaceholders = [appLabel: 'Lava Blob - Audio Size Test']
            matchingFallbacks = ['debug']
        }
    }

    // Reuse the three generated C4.1 audioTest resources as-is for the size
    // test: changes are ONLY runtime pitch/speed mapping.
    sourceSets {
        audioSizeTest {
            res.srcDirs += ['src/audioTest/res']
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.json:json:20240303'
}
