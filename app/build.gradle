plugins {
    id 'com.android.application'
}

android {
    namespace 'com.maryvellous.lavablobs'
    compileSdk 35

    buildFeatures { buildConfig true }

    defaultConfig {
        applicationId 'com.maryvellous.lavablobs'
        minSdk 26
        targetSdk 35
        versionCode 18
        versionName '1.1.0'
        buildConfigField 'boolean', 'AUDIO_DIAGNOSTICS', 'false'
        manifestPlaceholders = [appLabel: 'Lava Blob']
    }

    // Optional stable release key supplied through GitHub Actions secrets.
    // Never commit private keystores or passwords to the repository.
    signingConfigs {
        if (System.getenv('LAVA_SIGNING_STORE_FILE') &&
                System.getenv('LAVA_SIGNING_STORE_PASSWORD') &&
                System.getenv('LAVA_SIGNING_KEY_ALIAS') &&
                System.getenv('LAVA_SIGNING_KEY_PASSWORD')) {
            stable {
                storeFile file(System.getenv('LAVA_SIGNING_STORE_FILE'))
                storePassword System.getenv('LAVA_SIGNING_STORE_PASSWORD')
                keyAlias System.getenv('LAVA_SIGNING_KEY_ALIAS')
                keyPassword System.getenv('LAVA_SIGNING_KEY_PASSWORD')
            }
        }
    }

    buildTypes {
        release {
            if (signingConfigs.findByName('stable') != null)
                signingConfig signingConfigs.stable
        }
        // Preserve the approved preview package for side-by-side device tests.
        aggregationPreview {
            initWith debug
            applicationIdSuffix '.audioaggregation'
            versionNameSuffix '-aggregation-preview'
            buildConfigField 'boolean', 'AUDIO_DIAGNOSTICS', 'true'
            manifestPlaceholders = [appLabel: 'Lava Blob - Aggregation']
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.json:json:20240303'
}
